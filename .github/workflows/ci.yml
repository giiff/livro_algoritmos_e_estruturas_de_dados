name: CI

on:
  push:
  pull_request:

jobs:
  exemplos-c:
    name: Exemplos em C
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compilar e testar (avisos como erro, ASan e UBSan)
        run: make testes-c

  exemplos-python:
    name: Exemplos em Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: make testes-python

  livro:
    name: PDF do livro
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-lang-portuguese texlive-bibtex-extra \
            texlive-fonts-recommended texlive-pictures texlive-science biber latexmk
      - name: Compilar
        run: make livro
      - uses: actions/upload-artifact@v4
        with:
          name: livro-pdf
          path: livro_algoritmos_e_estruturas_de_dados.pdf
